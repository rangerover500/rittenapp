<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Kentekenherkenning testen</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6fb;color:#111;font-family:Arial,sans-serif}
    main{width:min(560px,100%);min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    h1{font-size:26px;margin:0 0 8px}
    p{line-height:1.45}
    .privacy{margin:0 0 16px;padding:12px;border:1px solid #bdd7c5;border-radius:10px;background:#effaf2;color:#174d26}
    button{min-height:50px;border:0;border-radius:10px;padding:11px 15px;font:700 16px Arial,sans-serif;touch-action:manipulation}
    .primary{width:100%;background:#111;color:#fff}
    .secondary{background:#e8ebf2;color:#111;border:1px solid #cfd5e1}
    .danger{background:#f7d9dc;color:#711923;border:1px solid #e1aeb4}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .toolbar button{flex:1 1 145px}
    .camera{display:none;margin-top:16px}
    .camera.active{display:block}
    .viewport{position:relative;overflow:hidden;border-radius:14px;background:#111;aspect-ratio:4/3}
    video{display:block;width:100%;height:100%;object-fit:cover}
    .plate-frame{position:absolute;left:5%;right:5%;top:33%;height:34%;border:3px solid #ffd400;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.22);pointer-events:none}
    .plate-frame::after{content:"Richt het kenteken binnen deze strook";position:absolute;left:0;right:0;bottom:calc(100% + 8px);color:#fff;text-align:center;font-weight:bold;text-shadow:0 1px 3px #000}
    .camera-diagnostics{margin-top:10px;padding:10px;border-radius:9px;background:#fff;border:1px solid #dbe0e9;font-size:13px;color:#444}
    .zoom-control{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:8px}
    .zoom-control[hidden]{display:none}
    .zoom-control label{font-weight:bold}
    .zoom-control input{width:100%;min-height:36px;margin:0}
    .zoom-value{min-width:42px;text-align:right;font-weight:bold;color:#111}
    .zoom-note{margin-top:5px}
    .status{min-height:24px;margin:14px 0 0;font-weight:bold}
    .status.error{color:#a00018}
    .raw{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#fff;border:1px solid #dbe0e9;overflow-wrap:anywhere}
    .raw.visible{display:block}
    .ocr-line{margin-top:5px}
    .ocr-previews{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
    .ocr-previews.visible{display:grid}
    .ocr-preview{margin:0;font-size:11px;text-align:center;color:#555}
    .ocr-preview canvas{display:block;width:100%;height:auto;margin-top:4px;border:1px solid #ccd2dd;border-radius:5px}
    .result{display:none;margin-top:16px;padding:18px;border:2px solid #111;border-radius:14px;background:#fff;text-align:center}
    .result.visible{display:block}
    .result h2{margin:0 0 8px;font-size:22px}
    .candidate{font-size:32px;font-weight:800;letter-spacing:3px;margin:8px 0}
    .suggestion{display:none;margin:10px 0;padding:10px;border-radius:8px;background:#fff6cf}
    .suggestion.visible{display:block}
    .chosen{display:none;margin-top:14px;padding:14px;border-radius:10px;background:#effaf2;font-weight:bold;text-align:center}
    .chosen.visible{display:block}
    canvas{display:none}
    @media(max-width:380px){
      main{padding-left:12px;padding-right:12px}
      h1{font-size:23px}
      .candidate{font-size:27px}
    }
  </style>
</head>
<body>
<main>
  <h1>Kentekenherkenning testen</h1>
  <p class="privacy">Camerabeeld en OCR worden alleen lokaal op dit apparaat verwerkt. Er wordt geen foto opgeslagen.</p>

  <button type="button" class="primary" id="scanBtn">📷 Scan kenteken</button>

  <section class="camera" id="cameraSection" aria-label="Camera">
    <div class="viewport">
      <video id="cameraVideo" playsinline muted></video>
      <div class="plate-frame" aria-hidden="true"></div>
    </div>
    <div class="camera-diagnostics">
      <div id="videoInfo">Resolutie wordt na het starten getoond.</div>
      <div class="zoom-control" id="zoomControl" hidden>
        <label for="zoomSlider">Zoom</label>
        <input type="range" id="zoomSlider">
        <output class="zoom-value" id="zoomValue" for="zoomSlider"></output>
      </div>
      <div class="zoom-note" id="zoomNote"></div>
    </div>
    <div class="toolbar">
      <button type="button" class="primary" id="readBtn">Lees kenteken</button>
      <button type="button" class="secondary" id="stopBtn">Stop camera</button>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="raw" id="rawResult">
    <strong>Ruwe OCR-tekst:</strong>
    <div class="ocr-line">OCR origineel: <span id="rawOriginal"></span></div>
    <div class="ocr-line">OCR contrast: <span id="rawContrast"></span></div>
    <div class="ocr-line">OCR zwart/wit: <span id="rawThreshold"></span></div>
    <div class="ocr-previews" id="ocrPreviews"></div>
  </div>

  <section class="result" id="resultSection" aria-live="polite">
    <h2>Kenteken herkend</h2>
    <div class="candidate" id="candidateText"></div>
    <div class="suggestion" id="suggestionBox">
      <span id="suggestionText"></span>
      <button type="button" class="secondary" id="confirmSuggestionBtn"></button>
    </div>
    <div class="toolbar">
      <button type="button" class="primary" id="useBtn">Gebruik kenteken</button>
      <button type="button" class="secondary" id="againBtn">Opnieuw scannen</button>
    </div>
  </section>

  <div class="chosen" id="chosenMessage"></div>
  <canvas id="captureCanvas"></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script>
"use strict";
const KNOWN_PLATES = ["X605VJ", "Z406BG"];
const DUTCH_PATTERNS = [
  /^[A-Z]{2}[0-9]{2}[0-9]{2}$/, /^[0-9]{2}[0-9]{2}[A-Z]{2}$/,
  /^[0-9]{2}[A-Z]{2}[0-9]{2}$/, /^[A-Z]{2}[0-9]{2}[A-Z]{2}$/,
  /^[A-Z]{2}[A-Z]{2}[0-9]{2}$/, /^[0-9]{2}[A-Z]{2}[A-Z]{2}$/,
  /^[0-9]{2}[A-Z]{3}[0-9]$/, /^[0-9][A-Z]{3}[0-9]{2}$/,
  /^[A-Z]{2}[0-9]{3}[A-Z]$/, /^[A-Z][0-9]{3}[A-Z]{2}$/,
  /^[A-Z]{3}[0-9]{2}[A-Z]$/, /^[A-Z][0-9]{2}[A-Z]{3}$/
];
const AMBIGUOUS = new Set(["O0","0O","I1","1I"]);

const scanBtn = document.getElementById("scanBtn");
const cameraSection = document.getElementById("cameraSection");
const video = document.getElementById("cameraVideo");
const videoInfo = document.getElementById("videoInfo");
const zoomControl = document.getElementById("zoomControl");
const zoomSlider = document.getElementById("zoomSlider");
const zoomValue = document.getElementById("zoomValue");
const zoomNote = document.getElementById("zoomNote");
const readBtn = document.getElementById("readBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const rawResult = document.getElementById("rawResult");
const rawOriginal = document.getElementById("rawOriginal");
const rawContrast = document.getElementById("rawContrast");
const rawThreshold = document.getElementById("rawThreshold");
const ocrPreviews = document.getElementById("ocrPreviews");
const resultSection = document.getElementById("resultSection");
const candidateText = document.getElementById("candidateText");
const suggestionBox = document.getElementById("suggestionBox");
const suggestionText = document.getElementById("suggestionText");
const confirmSuggestionBtn = document.getElementById("confirmSuggestionBtn");
const useBtn = document.getElementById("useBtn");
const againBtn = document.getElementById("againBtn");
const chosenMessage = document.getElementById("chosenMessage");
const canvas = document.getElementById("captureCanvas");

let stream = null;
let videoTrack = null;
let selectedCandidate = "";
let suggestedCandidate = "";

function setStatus(message, error=false){
  statusEl.textContent = message;
  statusEl.classList.toggle("error", error);
}
function stopCamera(){
  if(stream) stream.getTracks().forEach(track=>track.stop());
  stream = null;
  videoTrack = null;
  video.srcObject = null;
  cameraSection.classList.remove("active");
  zoomControl.hidden = true;
  zoomNote.textContent = "";
  videoInfo.textContent = "Resolutie wordt na het starten getoond.";
}
function clearTemporaryFrame(){
  const context = canvas.getContext("2d");
  context.clearRect(0, 0, canvas.width, canvas.height);
  canvas.width = 0;
  canvas.height = 0;
}
function resetResults(){
  selectedCandidate = "";
  suggestedCandidate = "";
  rawOriginal.textContent = "";
  rawContrast.textContent = "";
  rawThreshold.textContent = "";
  ocrPreviews.innerHTML = "";
  ocrPreviews.classList.remove("visible");
  rawResult.classList.remove("visible");
  resultSection.classList.remove("visible");
  suggestionBox.classList.remove("visible");
  chosenMessage.classList.remove("visible");
  chosenMessage.textContent = "";
  candidateText.textContent = "";
  setStatus("");
  clearTemporaryFrame();
}
async function startCamera(){
  resetResults();
  stopCamera();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus("Camera is in deze browser niet beschikbaar.", true);
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:3840,min:1280},height:{ideal:2160,min:720}},
      audio:false
    });
  }catch(firstError){
    if(firstError && firstError.name === "NotAllowedError"){
      setStatus("Cameratoegang is geweigerd. Geef Safari toestemming voor de camera.", true);
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
      setStatus("Geen achtercamera gevonden; een beschikbare camera is geopend.");
    }catch(error){
      setStatus(error && error.name === "NotAllowedError"
        ? "Cameratoegang is geweigerd. Geef Safari toestemming voor de camera."
        : "Camera kon niet worden geopend.", true);
      return;
    }
  }
  video.srcObject = stream;
  await video.play();
  videoTrack = stream.getVideoTracks()[0] || null;
  await setupCameraDiagnostics(videoTrack);
  cameraSection.classList.add("active");
  if(!statusEl.textContent) setStatus("Richt de camera op het kenteken en tik op ‘Lees kenteken’.");
}
function clampZoom(value,capability){
  return Math.min(capability.max,Math.max(capability.min,Number(value)));
}
function showZoomValue(value){
  zoomValue.value = Number(value).toFixed(1) + "×";
}
async function applyZoom(value){
  if(!videoTrack) return false;
  let capabilities;
  try{ capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {}; }
  catch(error){ capabilities = {}; }
  if(!capabilities.zoom) return false;
  const zoom = clampZoom(value,capabilities.zoom);
  try{
    await videoTrack.applyConstraints({advanced:[{zoom}]});
    zoomSlider.value = String(zoom);
    showZoomValue(zoom);
    zoomNote.textContent = "Camera-zoom beschikbaar.";
    return true;
  }catch(error){
    zoomNote.textContent = "Zoom kon niet worden ingesteld; de scanner blijft zonder aangepaste zoom werken.";
    return false;
  }
}
async function setupCameraDiagnostics(track){
  const settings = track && track.getSettings ? track.getSettings() : {};
  const width = settings.width || video.videoWidth || 0;
  const height = settings.height || video.videoHeight || 0;
  videoInfo.textContent = "Actieve videoresolutie: " + (width && height ? width + " × " + height : "onbekend");
  let capabilities = {};
  try{ capabilities = track && track.getCapabilities ? track.getCapabilities() : {}; }
  catch(error){ capabilities = {}; }
  const zoom = capabilities.zoom;
  if(!zoom || !Number.isFinite(zoom.min) || !Number.isFinite(zoom.max)){
    zoomControl.hidden = true;
    zoomNote.textContent = "Camera-zoom niet beschikbaar in deze browser.";
    return;
  }
  zoomSlider.min = String(zoom.min);
  zoomSlider.max = String(zoom.max);
  zoomSlider.step = String(zoom.step || 0.1);
  const initialZoom = clampZoom(2,zoom);
  zoomSlider.value = String(initialZoom);
  showZoomValue(initialZoom);
  zoomControl.hidden = false;
  zoomNote.textContent = "Camera-zoom beschikbaar.";
  await applyZoom(initialZoom);
}
zoomSlider.addEventListener("input",async ()=>{
  await applyZoom(zoomSlider.value);
});
function normalizeOcrText(text){
  return String(text||"").toUpperCase().replace(/[^A-Z0-9\s-]/g," ").replace(/[\s-]+/g," ").trim();
}
function isPlausibleDutchPlate(value){
  if(!DUTCH_PATTERNS.some(pattern=>pattern.test(value))) return false;
  if(KNOWN_PLATES.includes(value)) return true;
  return !/[AEIOU]/.test(value.replace(/[0-9]/g,""));
}
function collectOcrSequences(text){
  const sequences = new Map();
  const add = (value,score)=>{
    const compact = value.replace(/[^A-Z0-9]/g,"");
    if(compact.length === 6) sequences.set(compact,Math.max(score,sequences.get(compact)||0));
  };
  String(text||"").split(/\r?\n/).forEach(rawLine=>{
    const cleaned = normalizeOcrText(rawLine).replace(/\b(?:NL|EU)\b/g," ").replace(/\s+/g," ").trim();
    if(!cleaned) return;
    const groups = cleaned.split(" ");
    const lineCompact = groups.join("");
    if(lineCompact.length === 6) add(lineCompact,groups.length > 1 ? 150 : 140);
    groups.forEach(group=>{
      if(group.length === 6) add(group,140);
      if(group.length > 6){
        for(let index=0;index<=group.length-6;index++) add(group.slice(index,index+6),45);
      }
    });
    for(let start=0;start<groups.length;start++){
      let value = "";
      for(let end=start;end<Math.min(groups.length,start+4);end++){
        if(groups[end].length > 4) break;
        value += groups[end];
        if(value.length === 6) add(value,125-(end-start)*5);
        if(value.length >= 6) break;
      }
    }
  });
  return [...sequences].map(([value,score])=>({value,score}));
}
function extractCandidates(text){
  return collectOcrSequences(text)
    .filter(item=>isPlausibleDutchPlate(item.value))
    .map(item=>({...item,score:item.score+(KNOWN_PLATES.includes(item.value)?8:0)}))
    .sort((a,b)=>b.score-a.score || a.value.localeCompare(b.value))
    .map(item=>item.value);
}
function ambiguityDistance(value, known){
  if(value.length !== known.length) return Infinity;
  let differences = 0;
  for(let index=0;index<value.length;index++){
    if(value[index] === known[index]) continue;
    if(!AMBIGUOUS.has(value[index] + known[index])) return Infinity;
    differences++;
  }
  return differences;
}
function findKnownSuggestion(text){
  const possibilities = [];
  collectOcrSequences(text).forEach(sequence=>{
    KNOWN_PLATES.forEach(known=>{
      const distance = ambiguityDistance(sequence.value,known);
      if(distance > 0 && distance < Infinity) possibilities.push({known,distance,score:sequence.score});
    });
  });
  possibilities.sort((a,b)=>a.distance-b.distance || b.score-a.score);
  if(!possibilities.length) return "";
  if(possibilities.length > 1 && possibilities[0].distance === possibilities[1].distance && possibilities[0].known !== possibilities[1].known) return "";
  return possibilities[0].known;
}
function getFrameCrop(sourceWidth,sourceHeight,displayWidth,displayHeight){
  const scale = Math.max(displayWidth/sourceWidth, displayHeight/sourceHeight);
  const hiddenX = Math.max(0,(sourceWidth*scale-displayWidth)/2);
  const hiddenY = Math.max(0,(sourceHeight*scale-displayHeight)/2);
  return {
    x:Math.max(0,Math.round((hiddenX+displayWidth*.05)/scale)),
    y:Math.max(0,Math.round((hiddenY+displayHeight*.33)/scale)),
    width:Math.min(sourceWidth,Math.round(displayWidth*.90/scale)),
    height:Math.min(sourceHeight,Math.round(displayHeight*.34/scale))
  };
}
function otsuThreshold(grays){
  const histogram = new Uint32Array(256);
  grays.forEach(value=>histogram[value]++);
  const total = grays.length;
  let sum = 0;
  for(let value=0;value<256;value++) sum += value*histogram[value];
  let backgroundWeight = 0;
  let backgroundSum = 0;
  let bestVariance = -1;
  let threshold = 128;
  for(let value=0;value<256;value++){
    backgroundWeight += histogram[value];
    if(!backgroundWeight) continue;
    const foregroundWeight = total-backgroundWeight;
    if(!foregroundWeight) break;
    backgroundSum += value*histogram[value];
    const backgroundMean = backgroundSum/backgroundWeight;
    const foregroundMean = (sum-backgroundSum)/foregroundWeight;
    const variance = backgroundWeight*foregroundWeight*(backgroundMean-foregroundMean)**2;
    if(variance>bestVariance){ bestVariance=variance; threshold=value; }
  }
  return threshold;
}
function createOcrVariants(sourceCanvas){
  const width = sourceCanvas.width*2;
  const height = sourceCanvas.height*2;
  const makeCanvas = ()=>{
    const item = document.createElement("canvas");
    item.width = width;
    item.height = height;
    return item;
  };
  const original = makeCanvas();
  const originalContext = original.getContext("2d",{willReadFrequently:true});
  originalContext.imageSmoothingEnabled = true;
  originalContext.imageSmoothingQuality = "high";
  originalContext.drawImage(sourceCanvas,0,0,width,height);
  const sourceData = originalContext.getImageData(0,0,width,height);
  const contrast = makeCanvas();
  const contrastContext = contrast.getContext("2d",{willReadFrequently:true});
  const contrastData = contrastContext.createImageData(width,height);
  const grays = new Uint8Array(width*height);
  for(let pixel=0,index=0;pixel<sourceData.data.length;pixel+=4,index++){
    const gray = Math.round(sourceData.data[pixel]*.299+sourceData.data[pixel+1]*.587+sourceData.data[pixel+2]*.114);
    const enhanced = Math.max(0,Math.min(255,Math.round((gray-128)*1.9+128)));
    grays[index] = enhanced;
    contrastData.data[pixel] = enhanced;
    contrastData.data[pixel+1] = enhanced;
    contrastData.data[pixel+2] = enhanced;
    contrastData.data[pixel+3] = 255;
  }
  contrastContext.putImageData(contrastData,0,0);
  const thresholdValue = otsuThreshold(grays);
  const threshold = makeCanvas();
  const thresholdContext = threshold.getContext("2d");
  const thresholdData = thresholdContext.createImageData(width,height);
  for(let index=0,pixel=0;index<grays.length;index++,pixel+=4){
    const value = grays[index]>thresholdValue ? 255 : 0;
    thresholdData.data[pixel] = value;
    thresholdData.data[pixel+1] = value;
    thresholdData.data[pixel+2] = value;
    thresholdData.data[pixel+3] = 255;
  }
  thresholdContext.putImageData(thresholdData,0,0);
  return [
    {key:"original",label:"Origineel",canvas:original},
    {key:"contrast",label:"Contrast",canvas:contrast},
    {key:"threshold",label:"Zwart/wit",canvas:threshold,threshold:thresholdValue}
  ];
}
function showOcrPreviews(variants){
  ocrPreviews.innerHTML = "";
  variants.forEach(variant=>{
    const preview = document.createElement("figure");
    preview.className = "ocr-preview";
    const caption = document.createElement("figcaption");
    caption.textContent = variant.label;
    preview.append(caption,variant.canvas);
    ocrPreviews.appendChild(preview);
  });
  ocrPreviews.classList.add("visible");
}
function combineVariantCandidates(results){
  const combined = new Map();
  results.forEach(result=>{
    extractCandidates(result.text).forEach((candidate,index)=>{
      const current = combined.get(candidate) || {candidate,hits:0,score:0};
      current.hits++;
      current.score += Math.max(1,20-index);
      combined.set(candidate,current);
    });
  });
  return [...combined.values()]
    .sort((a,b)=>b.hits-a.hits || b.score-a.score || a.candidate.localeCompare(b.candidate))
    .map(item=>item.candidate);
}
function showCandidate(candidate, suggestion=""){
  selectedCandidate = candidate;
  candidateText.textContent = candidate;
  resultSection.classList.add("visible");
  suggestionBox.classList.toggle("visible", !!suggestion);
  suggestedCandidate = suggestion;
  if(suggestion){
    suggestionText.textContent = "Waarschijnlijk " + suggestion + ". Bevestig dit kenteken handmatig.";
    confirmSuggestionBtn.textContent = "Bevestig " + suggestion;
  }
}
async function readPlate(){
  if(!stream || video.readyState < 2){
    setStatus("Start eerst de camera en wacht tot het beeld zichtbaar is.", true);
    return;
  }
  if(!window.Tesseract){
    setStatus("De lokale OCR-library kon niet worden geladen.", true);
    return;
  }
  readBtn.disabled = true;
  resetResults();
  setStatus("Kenteken wordt lokaal gelezen…");
  const sourceWidth = video.videoWidth;
  const sourceHeight = video.videoHeight;
  const crop = getFrameCrop(sourceWidth,sourceHeight,video.clientWidth,video.clientHeight);
  canvas.width = crop.width;
  canvas.height = crop.height;
  const context = canvas.getContext("2d", {willReadFrequently:true});
  context.drawImage(video,crop.x,crop.y,crop.width,crop.height,0,0,crop.width,crop.height);
  let variants;
  try{
    variants = createOcrVariants(canvas);
  }catch(error){
    clearTemporaryFrame();
    readBtn.disabled = false;
    setStatus("Beeldvoorbewerking kon niet worden uitgevoerd. Probeer opnieuw.", true);
    return;
  }
  clearTemporaryFrame();
  showOcrPreviews(variants);
  const ocrResults = [];
  let worker = null;
  try{
    worker = await Tesseract.createWorker("eng",1,{
      logger: message=>{
        if(message.status === "recognizing text") setStatus("Kenteken wordt lokaal gelezen… " + Math.round(message.progress*100) + "%");
      }
    });
    await worker.setParameters({
      tessedit_pageseg_mode:Tesseract.PSM ? Tesseract.PSM.SINGLE_LINE : "7",
      tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- "
    });
    for(let index=0;index<variants.length;index++){
      const variant = variants[index];
      setStatus("OCR " + variant.label.toLowerCase() + " wordt lokaal gelezen… " + (index+1) + "/" + variants.length);
      try{
        const result = await worker.recognize(variant.canvas);
        ocrResults.push({key:variant.key,text:result && result.data ? result.data.text : ""});
      }catch(error){
        ocrResults.push({key:variant.key,text:""});
      }
    }
  }catch(error){
    setStatus("OCR kon het camerabeeld niet verwerken.", true);
    readBtn.disabled = false;
    return;
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(error){} }
  }
  readBtn.disabled = false;
  const textFor = key=>normalizeOcrText((ocrResults.find(result=>result.key===key)||{}).text) || "(geen tekst)";
  rawOriginal.textContent = textFor("original");
  rawContrast.textContent = textFor("contrast");
  rawThreshold.textContent = textFor("threshold");
  rawResult.classList.add("visible");
  const combinedText = ocrResults.map(result=>result.text).filter(Boolean).join("\n");
  if(!normalizeOcrText(combinedText)){
    setStatus("OCR heeft geen tekst gevonden. Probeer opnieuw met meer licht.", true);
    return;
  }
  const candidates = combineVariantCandidates(ocrResults);
  if(candidates.length){
    const suggestion = findKnownSuggestion(combinedText);
    showCandidate(candidates[0], suggestion && suggestion !== candidates[0] ? suggestion : "");
    setStatus(candidates.length > 1
      ? "Meerdere mogelijke kentekens gevonden. Sterkste eerst: " + candidates.join(", ") + ". Controleer de keuze."
      : "Controleer het herkende kenteken voordat je het gebruikt.");
    return;
  }
  const suggestion = findKnownSuggestion(combinedText);
  if(suggestion){
    const uncertain = collectOcrSequences(combinedText).sort((a,b)=>b.score-a.score)[0];
    showCandidate(uncertain ? uncertain.value : normalizeOcrText(combinedText).replace(/[\s-]/g,"").slice(0,6), suggestion);
    setStatus("Geen zeker kentekenpatroon gevonden; er is alleen een waarschijnlijk voorstel.", true);
    return;
  }
  setStatus("Geen plausibel Nederlands kenteken gevonden. Scan opnieuw.", true);
}

scanBtn.addEventListener("click",startCamera);
stopBtn.addEventListener("click",stopCamera);
readBtn.addEventListener("click",readPlate);
againBtn.addEventListener("click",async ()=>{
  resetResults();
  if(!stream) await startCamera();
  else setStatus("Richt het kenteken opnieuw binnen de strook.");
});
confirmSuggestionBtn.addEventListener("click",()=>{
  if(!suggestedCandidate) return;
  selectedCandidate = suggestedCandidate;
  candidateText.textContent = selectedCandidate;
  suggestionBox.classList.remove("visible");
  setStatus("Voorstel bevestigd. Controleer het kenteken nog één keer.");
});
useBtn.addEventListener("click",()=>{
  if(!selectedCandidate){
    setStatus("Er is nog geen kenteken gekozen.", true);
    return;
  }
  chosenMessage.textContent = "Gekozen kenteken: " + selectedCandidate;
  chosenMessage.classList.add("visible");
});
window.addEventListener("pagehide",()=>{
  stopCamera();
  clearTemporaryFrame();
});
</script>
</body>
</html>
