<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Routeadvies testen</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6fb;color:#111;font-family:Arial,sans-serif;overflow-x:hidden}
    main{width:min(620px,100%);min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    h1{margin:0 0 8px;font-size:27px}
    .intro{margin:0 0 18px;color:#555;line-height:1.45}
    .form-card,.result-card,.check-card{border:1px solid #dbe0e9;border-radius:12px;background:#fff;padding:14px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    label{display:block;font-weight:bold}
    select{display:block;width:100%;min-height:52px;margin-top:6px;padding:10px;border:1px solid #cbd2df;border-radius:9px;background:#fff;font:16px Arial,sans-serif}
    button{width:100%;min-height:54px;margin-top:15px;padding:12px 16px;border:0;border-radius:10px;background:#111;color:#fff;font:700 17px Arial,sans-serif;touch-action:manipulation}
    .result{display:none;margin-top:16px}
    .result.visible{display:block}
    .result-card h2{margin:0 0 10px;font-size:21px}
    .route{font-size:19px;font-weight:bold;line-height:1.45;overflow-wrap:anywhere}
    .main-route{margin-top:10px;color:#333}
    .warning{border-color:#e2ad61;background:#fff7e7;color:#713e00}
    .unknown{border-color:#aeb6c5;background:#f7f8fa}
    .checks{display:grid;gap:10px;margin-top:12px}
    .check-card h3{margin:0 0 7px;font-size:18px}
    .check-card ul{margin:0;padding-left:0;list-style:none}
    .check-card li{margin-top:5px}
    .note{margin-top:8px;font-weight:bold;color:#6a4100}
    @media(max-width:430px){main{padding-left:12px;padding-right:12px}.form-grid{grid-template-columns:1fr}h1{font-size:24px}}
  </style>
</head>
<body>
<main>
  <h1>Routeadvies testen</h1>
  <p class="intro">Deze losse test toont uitsluitend advies uit het vastgelegde rittenschema. Er wordt niets opgeslagen of in de Rittenapp gewijzigd.</p>

  <section class="form-card">
    <div class="form-grid">
      <label>Vertrekpunt
        <select id="start">
          <option>Rotterdam</option><option>Den Haag</option><option>Dordrecht</option><option>Brielle</option>
        </select>
      </label>
      <label>Eindbestemming
        <select id="end">
          <option>Rotterdam</option><option>Den Haag</option><option>Dordrecht</option><option>Brielle</option><option>Charlois</option>
        </select>
      </label>
      <label>Tussenstop 1
        <select id="stop1">
          <option>Geen</option><option>Rotterdam</option><option>Den Haag</option><option>Dordrecht</option><option>Brielle</option><option>Charlois</option>
        </select>
      </label>
      <label>Tussenstop 2
        <select id="stop2">
          <option>Geen</option><option>Rotterdam</option><option>Den Haag</option><option>Dordrecht</option><option>Brielle</option><option>Charlois</option>
        </select>
      </label>
    </div>
    <button type="button" id="checkRouteBtn">Controleer route</button>
  </section>

  <section class="result" id="result" aria-live="polite"></section>
</main>

<script>
"use strict";
const KNOWN_ROUTES = [
  {route:["Rotterdam","Den Haag"],mainRoute:"Nieuwe A16 → A13",checks:{"Rotterdam":["Den Haag"]}},
  {route:["Rotterdam","Brielle"],mainRoute:"A15 (Europoort)",checks:{"Rotterdam":["Brielle","Charlois"]}},
  {route:["Rotterdam","Dordrecht"],mainRoute:"A16 (Richting Breda)",checks:{"Rotterdam":["Dordrecht"]}},
  {route:["Rotterdam","Charlois"],mainRoute:"Lokaal / A15",checks:{"Rotterdam":["Charlois"]}},
  {route:["Den Haag","Rotterdam"],mainRoute:"Nieuwe A16",checks:{"Den Haag":["Rotterdam"]}},
  {route:["Dordrecht","Rotterdam"],mainRoute:"A16",checks:{"Dordrecht":["Rotterdam"]}},
  {route:["Brielle","Rotterdam"],mainRoute:"A15",checks:{"Brielle":["Charlois","Rotterdam"]}},

  {route:["Rotterdam","Den Haag","Charlois","Brielle"],checks:{"Rotterdam":["Den Haag","Charlois","Brielle"],"Den Haag":["Charlois","Brielle"],"Charlois":["Brielle"]}},
  {route:["Rotterdam","Den Haag","Dordrecht"],checks:{"Rotterdam":["Den Haag","Dordrecht"],"Den Haag":["Dordrecht"]}},
  {route:["Rotterdam","Dordrecht","Charlois","Brielle"],checks:{"Rotterdam":["Dordrecht","Charlois","Brielle"],"Dordrecht":["Charlois","Brielle"],"Charlois":["Brielle"]}},
  {route:["Rotterdam","Dordrecht","Den Haag"],checks:{"Rotterdam":["Dordrecht","Den Haag"],"Dordrecht":["Den Haag"]}},
  {route:["Rotterdam","Charlois","Brielle"],checks:{"Rotterdam":["Charlois","Brielle"],"Charlois":["Brielle"]},note:"Alleen lossen"},
  {route:["Den Haag","Rotterdam","Charlois","Brielle"],checks:{"Den Haag":["Rotterdam","Charlois","Brielle"],"Rotterdam":["Charlois","Brielle"]}},
  {route:["Den Haag","Rotterdam","Dordrecht"],checks:{"Den Haag":["Rotterdam","Dordrecht"],"Rotterdam":["Dordrecht"]}},
  {route:["Dordrecht","Rotterdam","Charlois","Brielle"],checks:{"Dordrecht":["Rotterdam","Charlois","Brielle"],"Rotterdam":["Charlois","Brielle"]}},
  {route:["Dordrecht","Rotterdam","Den Haag"],checks:{"Dordrecht":["Rotterdam","Den Haag"],"Rotterdam":["Den Haag"]}},
  {route:["Brielle","Charlois","Rotterdam","Den Haag"],checks:{"Brielle":["Charlois","Rotterdam","Den Haag"],"Charlois":["Rotterdam","Den Haag"],"Rotterdam":["Den Haag"]}},
  {route:["Brielle","Charlois","Rotterdam","Dordrecht"],checks:{"Brielle":["Charlois","Rotterdam","Dordrecht"],"Charlois":["Rotterdam","Dordrecht"],"Rotterdam":["Dordrecht"]}}
];
const ILLOGICAL_EXACT = new Map([
  ["Rotterdam|Charlois|Dordrecht","Charlois ligt richting Europoort/Brielle. Daarna naar Dordrecht of Den Haag rijden betekent onnodig omrijden."],
  ["Rotterdam|Charlois|Den Haag","Charlois ligt richting Europoort/Brielle. Daarna naar Dordrecht of Den Haag rijden betekent onnodig omrijden."],
  ["Den Haag|Dordrecht|Rotterdam","Rotterdam ligt logisch tussen Den Haag en Dordrecht. Stop eerst in Rotterdam."],
  ["Dordrecht|Den Haag|Rotterdam","Vanuit Dordrecht passeert de logische route richting Den Haag eerst Rotterdam. Stop dus eerst in Rotterdam."],
  ["Dordrecht|Brielle|Charlois|Rotterdam","Charlois wordt hierbij eerst voorbijgereden richting Brielle en daarna pas aangedaan. Dat is volgens het schema onlogisch."]
]);
const resultEl = document.getElementById("result");
function routeKey(route){ return route.join("|"); }
function classifyRoute(route){
  if(route[0]==="Charlois") return {type:"illogical",warning:"Charlois is volgens het schema een tussenstation/depot en geen vertrekpunt voor geplande ritten."};
  const warning=ILLOGICAL_EXACT.get(routeKey(route));
  if(warning) return {type:"illogical",warning};
  const known=KNOWN_ROUTES.find(item=>routeKey(item.route)===routeKey(route));
  return known ? {type:"known",data:known} : {type:"unknown"};
}
function buildSelectedRoute(){
  const route=[document.getElementById("start").value];
  [document.getElementById("stop1").value,document.getElementById("stop2").value].forEach(stop=>{if(stop!=="Geen")route.push(stop)});
  route.push(document.getElementById("end").value);
  return route;
}
function makeText(tag,className,text){
  const element=document.createElement(tag);
  if(className) element.className=className;
  element.textContent=text;
  return element;
}
function renderKnown(data){
  const summary=makeText("div","result-card","");
  summary.append(makeText("h2","","Logische bekende route"),makeText("div","route","Route: "+data.route.join(" → ")));
  if(data.mainRoute) summary.append(makeText("div","main-route","Hoofdroute: "+data.mainRoute));
  resultEl.appendChild(summary);
  const checks=makeText("div","checks","");
  Object.entries(data.checks).forEach(([location,boxes])=>{
    const card=makeText("article","check-card","");
    card.appendChild(makeText("h3","",location+":"));
    const list=document.createElement("ul");
    boxes.forEach(box=>list.appendChild(makeText("li","","✓ "+box)));
    card.appendChild(list);
    if(data.note&&location==="Charlois") card.appendChild(makeText("div","note","Opmerking: "+data.note.toLowerCase()));
    checks.appendChild(card);
  });
  resultEl.appendChild(makeText("h2","","Postbakcontrole:"));
  resultEl.appendChild(checks);
}
function renderRouteAdvice(route){
  const outcome=classifyRoute(route);
  resultEl.replaceChildren();
  resultEl.className="result visible";
  if(outcome.type==="known") renderKnown(outcome.data);
  if(outcome.type==="illogical"){
    const card=makeText("div","result-card warning","");
    card.append(makeText("h2","","Onlogische route"),makeText("div","route","Route: "+route.join(" → ")),makeText("p","",outcome.warning),makeText("p","","De route wordt niet geblokkeerd."));
    resultEl.appendChild(card);
  }
  if(outcome.type==="unknown"){
    const card=makeText("div","result-card unknown","");
    card.append(makeText("h2","","Onbekende route"),makeText("div","route","Route: "+route.join(" → ")),makeText("p","","Deze route staat niet in het rittenschema."));
    resultEl.appendChild(card);
  }
}
document.getElementById("checkRouteBtn").addEventListener("click",()=>renderRouteAdvice(buildSelectedRoute()));
</script>
</body>
</html>
