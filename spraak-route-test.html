<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Spraakroute testen</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6fb;color:#111;font-family:Arial,sans-serif;overflow-x:hidden}
    main{width:min(560px,100%);min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    h1{margin:0 0 8px;font-size:26px}
    p{line-height:1.45}
    .privacy{margin:0 0 16px;padding:12px;border:1px solid #bdd7c5;border-radius:10px;background:#effaf2;color:#174d26}
    button{min-height:52px;border:0;border-radius:10px;padding:11px 15px;font:700 16px Arial,sans-serif;touch-action:manipulation}
    button:disabled{opacity:.5}
    .primary{width:100%;background:#111;color:#fff}
    .secondary{background:#e8ebf2;color:#111;border:1px solid #cfd5e1}
    .yes{background:#d7f0dd;color:#164e24;border:1px solid #9bc8a6}
    .no{background:#f7d9dc;color:#711923;border:1px solid #e1aeb4}
    .status{min-height:24px;margin:14px 0;font-weight:bold;white-space:pre-line}
    .status.error{color:#a00018}
    .result{display:none;padding:15px;border:1px solid #dbe0e9;border-radius:12px;background:#fff}
    .result.visible{display:block}
    .transcript{margin-bottom:14px;padding:10px;border-radius:8px;background:#f1f3f8;overflow-wrap:anywhere}
    dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 10px;margin:0}
    dt{font-weight:bold}
    dd{margin:0;overflow-wrap:anywhere}
    .question{margin:18px 0 10px;font-size:21px;font-weight:bold;text-align:center}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .confirm-mic{width:100%;margin-top:10px}
    .agreed{display:none;margin-top:16px;padding:20px;border:2px solid #5a9d69;border-radius:12px;background:#effaf2;text-align:center;font-size:28px;font-weight:bold;color:#174d26}
    .agreed.visible{display:block}
    @media(max-width:380px){main{padding-left:12px;padding-right:12px}h1{font-size:23px}dl{grid-template-columns:95px minmax(0,1fr)}}
  </style>
</head>
<body>
<main>
  <h1>Spraakroute testen</h1>
  <p class="privacy">Deze pagina bewaart geen audio of transcript. Eigen code uploadt niets. De Web Speech API van Safari kan spraak door de browserleverancier laten verwerken.</p>

  <button type="button" class="primary" id="speakRouteBtn">🎤 Spreek route in</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="result" id="resultSection" aria-live="polite">
    <div class="transcript"><strong>Herkende tekst:</strong> <span id="transcriptText"></span></div>
    <dl>
      <dt>Van</dt><dd id="fromText"></dd>
      <dt>Naar</dt><dd id="toText"></dd>
      <dt>Vertrektijd</dt><dd id="departureText"></dd>
      <dt>Tussenstop(s)</dt><dd id="stopsText"></dd>
    </dl>
    <div class="question">Klopt dit?</div>
    <div class="actions">
      <button type="button" class="yes" id="yesBtn">JA</button>
      <button type="button" class="no" id="noBtn">NEE</button>
    </div>
    <button type="button" class="secondary confirm-mic" id="speakConfirmBtn">🎤 Zeg ja/nee</button>
  </section>

  <div class="agreed" id="agreed" aria-live="polite">Akkoord</div>
</main>

<script>
"use strict";
const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const speakRouteBtn = document.getElementById("speakRouteBtn");
const speakConfirmBtn = document.getElementById("speakConfirmBtn");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const statusEl = document.getElementById("status");
const resultSection = document.getElementById("resultSection");
const transcriptText = document.getElementById("transcriptText");
const fromText = document.getElementById("fromText");
const toText = document.getElementById("toText");
const departureText = document.getElementById("departureText");
const stopsText = document.getElementById("stopsText");
const agreed = document.getElementById("agreed");
let activeRecognition = null;

function setStatus(message,error=false){
  statusEl.textContent = message;
  statusEl.classList.toggle("error",error);
}
function pad(value){ return String(value).padStart(2,"0"); }
function localTimeNow(){
  const now = new Date();
  return pad(now.getHours()) + ":" + pad(now.getMinutes());
}
const DUTCH_SMALL_NUMBERS = new Map([
  ["nul",0],["een",1],["twee",2],["drie",3],["vier",4],["vijf",5],["zes",6],["zeven",7],["acht",8],["negen",9],
  ["tien",10],["elf",11],["twaalf",12],["dertien",13],["veertien",14],["vijftien",15],["zestien",16],["zeventien",17],["achttien",18],["negentien",19]
]);
const DUTCH_TENS = new Map([["twintig",20],["dertig",30],["veertig",40],["vijftig",50],["zestig",60],["zeventig",70],["tachtig",80],["negentig",90]]);
const HOUSE_NUMBER_CUES = new Set(["nummer","nr","huisnummer"]);
const NON_ADDRESS_PREFIXES = new Set(["de","het","een","van","naar","met","als"]);
function normalizeNumberWordKey(value){
  return String(value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function parseDutchNumberWord(value){
  const word = normalizeNumberWordKey(value);
  if(DUTCH_SMALL_NUMBERS.has(word)) return DUTCH_SMALL_NUMBERS.get(word);
  if(DUTCH_TENS.has(word)) return DUTCH_TENS.get(word);
  for(const [unitWord,unit] of DUTCH_SMALL_NUMBERS){
    if(unit<1 || unit>9) continue;
    for(const [tensWord,tens] of DUTCH_TENS){
      if(word===unitWord+"en"+tensWord) return tens+unit;
    }
  }
  return null;
}
function normalizeAddressHouseNumberWords(value){
  const words = String(value||"").split(/\s+/).filter(Boolean);
  return words.map((word,index)=>{
    const number = parseDutchNumberWord(word);
    if(number===null) return word;
    const previous = normalizeNumberWordKey(words[index-1]);
    const next = normalizeNumberWordKey(words[index+1]);
    const hasLikelyNameBefore = index>0 && !NON_ADDRESS_PREFIXES.has(previous);
    const afterNumberCue = HOUSE_NUMBER_CUES.has(previous);
    const atStreetNameEnd = hasLikelyNameBefore && index===words.length-1;
    const beforePlaceMarker = hasLikelyNameBefore && next==="in";
    const streetNameBefore = words.slice(0,index).some(part=>/(?:straat|weg|laan|plein|kade|dijk|gracht|singel|steeg|pad|dreef|markt|plantsoen|wijk)$/i.test(part));
    const beforePlaceName = streetNameBefore && index<words.length-1;
    return afterNumberCue || atStreetNameEnd || beforePlaceMarker || beforePlaceName ? String(number) : word;
  }).join(" ");
}
function tidyPlace(value){
  const cleaned = String(value||"").replace(/^[\s,.;:]+|[\s,.;:]+$/g,"").replace(/\s+/g," ").trim();
  const normalized = normalizeAddressHouseNumberWords(cleaned);
  return normalized!==cleaned && /^[a-zà-ÿ]/.test(normalized) ? normalized.charAt(0).toUpperCase() + normalized.slice(1) : normalized;
}
function parseDepartureTime(text,nowProvider=localTimeNow){
  if(/\bvertrek(?:tijd)?\s+is\s+nu\b/i.test(text)) return nowProvider();
  const match = text.match(/\bvertrek(?:tijd)?(?:\s+is)?(?:\s+om)?\s+(\d{1,2})[.:](\d{2})\b/i);
  if(!match) return "";
  const hour = Number(match[1]);
  const minute = Number(match[2]);
  if(hour>23 || minute>59) return "";
  return pad(hour) + ":" + pad(minute);
}
function parseRouteSentence(transcript,nowProvider=localTimeNow){
  const text = String(transcript||"").replace(/\s+/g," ").trim();
  const route = text.match(/\bvan\s+(.+?)\s+naar\s+(.+?)(?=\s+(?:via\b|met\s+als\s+tussenstop\b|(?:ik\s+)?vertrek(?:tijd)?\b|en\s+ik\s+heb\s+geen\s+tussenstop\b)|[,.;!?]|$)/i);
  const noStops = /\bgeen\s+tussenstops?\b/i.test(text);
  let stops = [];
  if(!noStops){
    const stopMatch = text.match(/\b(?:via|met\s+als\s+tussenstop)\s+(.+?)(?=\s+(?:ik\s+)?vertrek(?:tijd)?\b|[,.;!?]|$)/i);
    if(stopMatch){
      stops = stopMatch[1].split(/\s*(?:,|\ben\b)\s*/i).map(tidyPlace).filter(Boolean);
    }
  }
  return {
    transcript:text,
    from:route ? tidyPlace(route[1]) : "",
    to:route ? tidyPlace(route[2]) : "",
    departure:parseDepartureTime(text,nowProvider),
    stops
  };
}
function resetResult(){
  transcriptText.textContent = "";
  fromText.textContent = "";
  toText.textContent = "";
  departureText.textContent = "";
  stopsText.textContent = "";
  resultSection.classList.remove("visible");
  agreed.classList.remove("visible");
}
function showParsedResult(result){
  transcriptText.textContent = result.transcript;
  fromText.textContent = result.from || "Niet herkend";
  toText.textContent = result.to || "Niet herkend";
  departureText.textContent = result.departure || "Niet herkend";
  stopsText.textContent = result.stops.length ? result.stops.join(", ") : "Geen";
  agreed.classList.remove("visible");
  resultSection.classList.add("visible");
  const complete = !!(result.from && result.to && result.departure);
  setStatus(complete ? "Controleer de herkende route." : "Niet alle onderdelen zijn herkend. De parser gokt geen ontbrekende gegevens.",!complete);
}
function stopRecognition(){
  const recognition = activeRecognition;
  activeRecognition = null;
  if(recognition){ try{ recognition.abort(); }catch(error){} }
  speakRouteBtn.disabled = false;
  speakConfirmBtn.disabled = false;
}
function createRecognition(onTranscript){
  if(!SpeechRecognitionApi){
    setStatus("Spraakherkenning wordt in deze browser niet ondersteund.",true);
    return null;
  }
  stopRecognition();
  const recognition = new SpeechRecognitionApi();
  recognition.lang = "nl-NL";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = event=>{
    const transcript = String(event.results?.[0]?.[0]?.transcript||"").trim();
    if(transcript) onTranscript(transcript);
    else setStatus("Geen spraak herkend. Probeer opnieuw.",true);
  };
  recognition.onerror = event=>{
    if(activeRecognition !== recognition) return;
    const friendlyMessage = event.error === "not-allowed" ? "Microfoontoegang is geweigerd." : "Spraakherkenning is mislukt. Probeer opnieuw.";
    const errorCode = String(event.error || "onbekend");
    const technicalMessage = event.message ? "\nMelding: " + String(event.message) : "";
    setStatus(friendlyMessage + "\nFoutcode: " + errorCode + technicalMessage,true);
  };
  recognition.onend = ()=>{
    if(activeRecognition !== recognition) return;
    activeRecognition = null;
    speakRouteBtn.disabled = false;
    speakConfirmBtn.disabled = false;
  };
  return recognition;
}
function startRouteRecognition(){
  resetResult();
  const recognition = createRecognition(transcript=>showParsedResult(parseRouteSentence(transcript)));
  if(!recognition) return;
  activeRecognition = recognition;
  speakRouteBtn.disabled = true;
  speakConfirmBtn.disabled = true;
  setStatus("Luisteren naar de routezin…");
  recognition.start();
}
function confirmYes(){
  stopRecognition();
  resultSection.classList.remove("visible");
  agreed.classList.add("visible");
  setStatus("");
}
function confirmNo(){
  stopRecognition();
  resetResult();
  setStatus("Spreek de route opnieuw in.");
}
function startConfirmationRecognition(){
  const recognition = createRecognition(transcript=>{
    const answer = transcript.toLowerCase().replace(/[^a-zà-ÿ]/g,"").trim();
    if(answer==="ja") confirmYes();
    else if(answer==="nee") confirmNo();
    else setStatus("Zeg alleen ja of nee.",true);
  });
  if(!recognition) return;
  activeRecognition = recognition;
  speakRouteBtn.disabled = true;
  speakConfirmBtn.disabled = true;
  setStatus("Luisteren… zeg alleen ja of nee.");
  recognition.start();
}

speakRouteBtn.addEventListener("click",startRouteRecognition);
speakConfirmBtn.addEventListener("click",startConfirmationRecognition);
yesBtn.addEventListener("click",confirmYes);
noBtn.addEventListener("click",confirmNo);
window.addEventListener("pagehide",stopRecognition);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopRecognition(); });
</script>
</body>
</html>
