<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Test terug naar Rittenapp</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6fb;color:#111;font-family:Arial,sans-serif;overflow-x:hidden}
    main{width:min(560px,100%);min-height:100vh;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
    h1{margin:0 0 18px;font-size:28px;text-align:center}
    .mode{margin:0 0 20px;padding:14px;border:2px solid #111;border-radius:12px;background:#fff;text-align:center;font-size:19px;font-weight:bold}
    .open-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:62px;padding:14px 18px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-size:20px;font-weight:bold;touch-action:manipulation}
    .explanation{margin:18px 0 0;line-height:1.5;text-align:center;color:#444}
    @media(max-width:380px){main{padding-left:12px;padding-right:12px}h1{font-size:25px}.open-button{font-size:19px}}
  </style>
</head>
<body>
<main>
  <h1>Test terug naar Rittenapp</h1>
  <div class="mode" id="displayMode" aria-live="polite"></div>
  <a class="open-button" href="webapp://rangerover500.github.io/rittenapp/">Open Rittenapp</a>
  <p class="explanation">Als deze test werkt, moet iOS Safari verlaten en de reeds geïnstalleerde Rittenapp op het beginscherm openen.</p>
</main>
<script>
"use strict";
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
document.getElementById("displayMode").textContent = standalone ? "Standalone/PWA" : "Browser";
</script>
</body>
</html>
